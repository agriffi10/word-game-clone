name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Node / TypeScript ──────────────────────────────────────────────────────
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run format # prettier --check
      - run: npm run lint # eslint
      - run: npm run typecheck # tsc --noEmit
      - run: npm test # vitest run (unit tests)
